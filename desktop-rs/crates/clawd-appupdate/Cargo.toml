[package]
name = "clawd-appupdate"
description = "App self-update from GitHub Releases: find, download, verify (SHA256SUMS + minisign), stage, apply on user request."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
clawd-contracts = { workspace = true }
clawd-store = { workspace = true }
clawd-config = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
minisign-verify = { workspace = true }
plist = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
clawd-testkit = { workspace = true }
tempfile = { workspace = true }
# Throwaway key pairs for the signature tests are generated at test time (no secret is committed).
minisign = "0.7"
