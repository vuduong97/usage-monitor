[package]
name = "clawd-firmware"
description = "Bundled firmware, the firmware feed (manifest, grant, renderers), OTA to the clock, clock-screen preview."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
clawd-contracts = { workspace = true }
clawd-store = { workspace = true }
clawd-config = { workspace = true }
clawd-clock = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
aes-gcm = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
miniz_oxide = { workspace = true }
# Only the deflate method is needed (tools/build_preview.py writes a deflated zip). The workspace
# pin enables every zip feature (bzip2, zstd, lzma, aes: C builds); see Contract CR in the phase-09 report.
zip = { version = "9", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
clawd-testkit = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

# A stand-in for `clawd_render` (tests/support/fake_clawd_render.rs): integration tests copy it
# next to a fake renderer folder and drive it with a `mode` file. It is the only way to run a
# "renderer" on every OS (the Python tests used a shell script, POSIX only). Not shipped: the app
# depends on the library only.
[[bin]]
name = "fake_clawd_render"
path = "tests/support/fake_clawd_render.rs"
test = false
