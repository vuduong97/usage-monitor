[package]
name = "clawd-store"
description = "On-disk and OS-store layer: prefs (desktop.json + lock), pause lease, ota.busy, usage payload file, log, keyring creds, autostart, firstrun."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
clawd-contracts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
plist = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Win32_System_IO (OVERLAPPED for LockFileEx) and Win32_Foundation are added on top of the
# workspace feature list; Win32_System_Registry / Win32_Security_Credentials come from it.
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_IO"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true }

[dev-dependencies]
clawd-testkit = { workspace = true }
tempfile = { workspace = true }
