[package]
name = "clawd-store"
description = "On-disk and OS-store layer: prefs (desktop.json + lock), pause lease, ota.busy, usage payload file, log, keyring creds, autostart, firstrun."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
clawd-contracts = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
plist = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Added on top of the workspace feature list: Win32_System_IO (OVERLAPPED for LockFileEx),
# Win32_UI_Shell + WindowsAndMessaging (ShellExecuteW for open_path). Win32_System_Registry and
# Win32_Security_Credentials come from the workspace list.
windows = { workspace = true, features = ["Win32_Foundation", "Win32_System_IO", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { workspace = true }

[dev-dependencies]
clawd-testkit = { workspace = true }
tempfile = { workspace = true }
