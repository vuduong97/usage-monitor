[package]
name = "clawd-spike"
version = "0.0.0"
description = "Throwaway Tauri 2.12 spike for phase 01 (size, idle RAM, paint, 50 open/close cycles). Not shipped."
edition = "2021"
publish = false

# Standalone project: the empty table keeps cargo from adopting this package into the
# desktop-rs workspace that phase 02 creates one directory up.
[workspace]

[features]
default = ["tls-ring"]
# rustls crypto provider under reqwest. ring needs only a C compiler; aws-lc needs CMake
# (and NASM unless prebuilt objects apply) on Windows. See reports/spike-decision.md.
tls-ring = ["reqwest/rustls-no-provider", "dep:rustls"]
tls-aws-lc = ["reqwest/rustls"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["charset", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "unwind"
strip = true

# Same as release, one knob changed, for the size comparison in reports/spike-decision.md.
[profile.release-z]
inherits = "release"
opt-level = "z"

[profile.release-abort]
inherits = "release"
panic = "abort"
