[package]
name = "clawd-e2e"
description = "Headless end-to-end tests (phase 14): the engine pieces over a temp home, loopback fakes only."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Library level only: no window, no tray, no WebView, nothing outside the temp home. The harness
# lives in `src/`, the scenarios in `tests/`.
[dependencies]
clawd-app = { path = "../app" }
clawd-contracts = { workspace = true }
clawd-store = { workspace = true }
clawd-config = { workspace = true }
clawd-events = { workspace = true }
clawd-agents = { workspace = true }
clawd-usage = { workspace = true }
clawd-clock = { workspace = true }
clawd-testkit = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
