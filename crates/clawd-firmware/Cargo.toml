[package]
name = "clawd-firmware"
description = "Bundled firmware, remote style packs (signed GitHub Release), OTA to the clock, clock-screen preview."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
clawd-contracts = { workspace = true }
clawd-store = { workspace = true }
clawd-config = { workspace = true }
clawd-clock = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
miniz_oxide = { workspace = true, features = ["with-alloc"] }
minisign-verify = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
clawd-testkit = { workspace = true }
tempfile = { workspace = true }
minisign = "0.7"
tokio = { workspace = true, features = ["test-util"] }

# A stand-in for `clawd_render` (tests/support/fake_clawd_render.rs): integration tests copy it
# next to a fake renderer folder and drive it with a `mode` file. It is the only way to run a
# "renderer" on every OS (the Python tests used a shell script, POSIX only). Not shipped: the app
# depends on the library only.
[[bin]]
name = "fake_clawd_render"
path = "tests/support/fake_clawd_render.rs"
test = false
