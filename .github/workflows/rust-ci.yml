name: Rust CI

# The Rust + Tauri port lives in desktop-rs/. No secrets here (minisign signing and feed tokens are
# release-only, phase 11). Actions are pinned to commit SHAs.
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check-public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (== tag v4)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: No firmware, packs, fonts, art or home paths in this repo
        run: python tools/check_public.py

  # The golden harness must stay safe, and the checked-in sample fixture must be what the real
  # Python app produces (it needs only the standard library).
  golden-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (== tag v4)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python tools/golden/_harness.py --selftest
      - run: python tools/golden/export_sample.py
      - name: Fixtures are reproducible (no change, nothing new)
        run: |
          git status --porcelain desktop-rs/fixtures
          test -z "$(git status --porcelain desktop-rs/fixtures)"

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-rs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (== tag v4)
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop-rs
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release -p clawd-app

  # Linux is a non-goal: only the OS-neutral crates must keep compiling there.
  ubuntu-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop-rs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (== tag v4)
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable branch
        with:
          toolchain: 1.91.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: desktop-rs
      - run: cargo check -p clawd-contracts -p clawd-config -p clawd-events
