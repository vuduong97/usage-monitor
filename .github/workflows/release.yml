name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  public-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_public.py
      - name: The tag is the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        # The self-update compares the tag with __version__: a release whose build says
        # another version would be offered again after every update.
        run: |
          v=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('clawd_desktop/__init__.py').read())[1])")
          p=$(python3 -c "import re;print(re.search(r'^version = \"([^\"]+)\"', open('pyproject.toml').read(), re.M)[1])")
          [ "v$v" = "$GITHUB_REF_NAME" ] && [ "$p" = "$v" ] || { echo "tag $GITHUB_REF_NAME, __version__ $v, pyproject $p: they must agree"; exit 1; }

  mac:
    needs: public-check
    strategy:
      matrix:
        runner: [macos-14, macos-15-intel]     # Apple silicon, Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.12 --group dev python -m pytest
      - name: Developer ID certificate
        # Secrets: MACOS_CERT_P12 (base64 of the .p12), MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY
        # ("Developer ID Application: Name (TEAMID)"). Without them the build is ad-hoc signed.
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [ -z "$CERT_P12" ] || [ -z "$SIGN_IDENTITY" ]; then
            echo "::warning::No Developer ID certificate in the secrets: this build is ad-hoc signed and not notarized"
            exit 0
          fi
          KC="$RUNNER_TEMP/clawd.keychain-db"; PW=$(uuidgen)
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "CLAWD_SIGN_IDENTITY=$SIGN_IDENTITY" >> "$GITHUB_ENV"
      - run: sh packaging/build_mac.sh
        env:
          CLAWD_FEED_URL: ${{ secrets.CLAWD_FEED_URL }}
          CLAWD_FEED_TOKEN: ${{ secrets.CLAWD_FEED_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.runner }}
          path: |
            dist/*.dmg
            dist/*.zip

  windows:
    needs: public-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.12 --group dev python -m pytest
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: ./packaging/build_windows.ps1
        shell: pwsh
        env:
          CLAWD_FEED_URL: ${{ secrets.CLAWD_FEED_URL }}
          CLAWD_FEED_TOKEN: ${{ secrets.CLAWD_FEED_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*-setup.exe

  publish:
    # Only a tag publishes. The release stays a draft until every file is attached, so the
    # app's update check never sees a release without its installer or SHA256SUMS.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: assets
        run: |
          sha256sum Clawd-* > SHA256SUMS
          cat SHA256SUMS
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac   # v1.2.3-rc1: never offered by the app
          gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" \
            --title "Clawd ${GITHUB_REF_NAME#v}" --generate-notes --draft $flags
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
