name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  public-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_public.py

  mac:
    needs: public-check
    strategy:
      matrix:
        runner: [macos-14, macos-15-intel]     # Apple silicon, Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.12 --group dev python -m pytest
      - run: sh packaging/build_mac.sh
        env:
          CLAWD_FEED_URL: ${{ secrets.CLAWD_FEED_URL }}
          CLAWD_FEED_TOKEN: ${{ secrets.CLAWD_FEED_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.runner }}
          path: dist/*.dmg

  windows:
    needs: public-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.12 --group dev python -m pytest
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - run: ./packaging/build_windows.ps1
        shell: pwsh
        env:
          CLAWD_FEED_URL: ${{ secrets.CLAWD_FEED_URL }}
          CLAWD_FEED_TOKEN: ${{ secrets.CLAWD_FEED_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*-setup.exe

  release:
    needs: [mac, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
