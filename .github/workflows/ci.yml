name: CI

# Clawd (Rust + Tauri): the Cargo workspace is the repo root; the clock firmware lives in
# clock/ and ships inside every app release. No secrets here (minisign signing is
# release-only). Actions are pinned to commit SHAs. The Python 0.1.x app and its tests live
# on the branch python-0.1.x.
on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  repo:
    runs-on: ubuntu-latest
    steps:
      # v4.4.0 (== tag v4)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Firmware code changes raise CLAWD_FW_SEQ
        # Installed apps put their bundled image only on a clock with a lower fwSeq.
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python tools/check_fw_seq.py "$BASE"
      - name: releases/latest is an app release (v*)
        # Apps 0.1.x/0.2.x update from /releases/latest: a packs-api* (or any non-v*) release
        # there would stop every installed app from updating.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          case "$latest" in
            v*) echo "releases/latest: $latest" ;;
            "") echo "::warning::could not read releases/latest (none yet, or the API failed)" ;;
            *) echo "::error::releases/latest is $latest, not a v* tag: gh release edit <vX.Y.Z> --latest"; exit 1 ;;
          esac
      - name: Tests of the release version guard
        run: python -m unittest discover -s packaging

  # The clock firmware, its bundle (what the app ships) and the renderer, from this commit.
  firmware:
    runs-on: ubuntu-latest
    steps:
      # v4.4.0 (== tag v4)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0   # the style packs' rev is the commit time of clock/firmware/styles
      # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: PlatformIO
        run: python -m pip install --quiet "platformio==6.2.0"
      - name: Firmware bundle and renderer
        run: sh tools/build_clock.sh
      - name: The bundle checks out
        run: python tools/bundle_firmware.py --check build/firmware
      - name: The renderer draws every style pack
        env:
          PYTHON: python
        run: sh tools/smoke_renderer.sh build/renderer
      - name: The style packs stage for packs-api<N>
        run: python tools/publish_packs.py
      # v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clock-firmware
          path: build/firmware
          if-no-files-found: error

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      # v4.4.0 (== tag v4)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # stable branch
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy
      # v2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --workspace --release -p clawd-app

  # Linux is a non-goal: only the OS-neutral crates must keep compiling there.
  ubuntu-check:
    runs-on: ubuntu-latest
    steps:
      # v4.4.0 (== tag v4)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # stable branch
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          toolchain: 1.91.0
      # v2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      - run: cargo check -p clawd-contracts -p clawd-config -p clawd-events
