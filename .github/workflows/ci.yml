name: CI
on:
  push:
    branches: [python-0.1.x]
  pull_request:

jobs:
  public-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No firmware, packs, fonts or Clawd art in this repo
        run: python3 tools/check_public.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12 --group dev
      - run: uv run --python 3.12 --group dev python -m pytest
