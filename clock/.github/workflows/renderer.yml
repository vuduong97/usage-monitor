# The clock-screen renderer the Clawd desktop app previews the usage styles with, built
# from this repo's drawing code for every desktop platform. tools/fetch_renderer.sh runs
# it and downloads the zips into build/renderer/; tools/release.sh puts them in the feed.
# The source never leaves this (private) repo: only the compiled, stripped program does.
name: Renderer
on:
  workflow_dispatch:
    inputs:
      desktop_ref:
        description: "usage-monitor ref whose build_preview.py + clawd_render.cpp to build with"
        default: main
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win-x64
            runner: windows-latest
          - platform: mac
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: clawd-desktop (public) for its build_preview.py and clawd_render.cpp
        uses: actions/checkout@v4
        with:
          repository: vuduong97/usage-monitor
          ref: ${{ inputs.desktop_ref }}
          path: desktop
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (Windows, MinGW g++, static)
        if: matrix.platform == 'win-x64'
        shell: bash
        env:
          CXX: g++
        run: |
          python desktop/tools/build_preview.py --src firmware --commit "$(git rev-parse HEAD)" \
            --windows --out build/renderer/win-x64 --zip build/renderer/win-x64.zip
      - name: Build (macOS, one universal file)
        if: matrix.platform == 'mac'
        env:
          CXX: clang++
          CXXFLAGS: -arch arm64 -arch x86_64 -mmacosx-version-min=11.0
          # Signed ad hoc. For the app's Developer ID, import the certificate into a keychain
          # first (see usage-monitor's release.yml) and set CLAWD_SIGN_IDENTITY.
        run: |
          python desktop/tools/build_preview.py --src firmware --commit "$(git rev-parse HEAD)" \
            --out build/renderer/mac --zip build/renderer/mac.zip
          lipo -info build/renderer/mac/clawd_render
      - name: Smoke test (waiting screen, every style, an animated clip; on the Mac both halves)
        shell: bash
        run: |
          d=build/renderer/${{ matrix.platform }}
          exe=$(python -c "import json,sys;print(json.load(open(sys.argv[1]))['exe'])" "$d/preview.json")
          payload='{"s":42,"sr":134,"w":67,"wr":3960,"t":1760191500,"tf":24}'
          runs="$d/$exe"
          [ "${{ matrix.platform }}" = mac ] && runs="$runs|arch -x86_64 $d/$exe"
          IFS='|'
          for run in $runs; do
            IFS=' '
            n=$(: | $run --pak "$d/clawd.pak" | wc -c | tr -d ' ')
            [ "$n" = 172800 ] || { echo "$run classic: $n bytes"; exit 1; }
            for p in "$d"/styles/*.pak; do
              n=$(echo "$payload" | $run --pak "$d/clawd.pak" --style "$p" | wc -c | tr -d ' ')
              [ "$n" = 172800 ] || { echo "$run $p: $n bytes"; exit 1; }
            done
            # to a file, not `| head`: head closes the pipe early and pipefail fails the step
            echo "$payload" | $run --pak "$d/clawd.pak" --clip > "$RUNNER_TEMP/clip.bin"
            magic=$(head -c 4 "$RUNNER_TEMP/clip.bin")
            [ "$magic" = CLP1 ] || { echo "$run --clip: no CLP1"; exit 1; }
            IFS='|'
          done
          ls -l "build/renderer/${{ matrix.platform }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: renderer-${{ matrix.platform }}
          path: build/renderer/${{ matrix.platform }}.zip
          retention-days: 30
          if-no-files-found: error
