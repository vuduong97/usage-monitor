; PlatformIO project for the Clawd desk clock firmware.
;
; Board: JUZIPi SmallTV SD Pro (1.54" 240x240 ST7789 IPS, ESP-12F / ESP8266).
;
; Build:           pio run -e clawd        -> .pio/build/clawd/firmware.bin
; Flash over WiFi: tools/flash.sh <ip>             (POST /update)
; Flash via USB:   pio run -e clawd -t upload
;
; License: WTFPL

[platformio]
default_envs = clawd

; ---------------------------------------------------------------------------
; ESP8266, Clawd. The Clawd screens (features/clawd) fed by the desktop app's
; HTTP push.
;
; Flash layout is the clock's STOCK one (4m3m: 1 MB sketch, 3 MB LittleFS at
; 0x100000), so the stock filesystem (its web UI, icons and fonts, published
; nowhere) survives and the stock firmware can be flashed back through /update.
; Consequences:
;   - the image must stay under ~550 KB: stock OTA stages the new image in
;     what is left of the 1 MB sketch area (1,048,576 - current image);
;   - the Clawd animations are files (/clawd.pak, /desk.pak), not PROGMEM;
;   - no TLS (no GitHub self-update, no https pull);
;   - the filesystem is never formatted (Settings.cpp).
; ---------------------------------------------------------------------------
[env:clawd]
platform = espressif8266
board = esp12e
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m3m.ld
extra_scripts = pre:extra_script.py, post:no_float_io.py

monitor_speed = 115200
upload_speed = 921600

build_flags =
	-D SMALLTV_ESP8266
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
	-D ARDUINOJSON_USE_DOUBLE=0

; Feature folders on the include path so cross-module quote-includes resolve.
; These MUST be build_src_flags (project sources only), not build_flags: a global
; -Isrc leaks into the framework build and shadows framework headers.
build_src_flags =
	-iquote src
	-iquote src/features/usage
	-iquote src/features/clawd

lib_deps =
	bblanchon/ArduinoJson @ ^7.2.0
	moononournation/GFX Library for Arduino @ ^1.5.0

; ---------------------------------------------------------------------------
; Minimal OTA loader (src/loader.cpp). A tiny WiFi + web-OTA image, small
; enough to slip through a stock firmware whose updater rejects the full image
; for lack of space (e.g. the GeekMagic SmallTV-ultra). Flash it over the stock
; OTA, then flash the real firmware over the loader's /update. Pass WiFi at
; build time: -DLOADER_SSID='"MyNet"' -DLOADER_PASS='"secret"' (else it opens a
; SmallTV-Loader AP). build_src_filter compiles ONLY the loader.
; ---------------------------------------------------------------------------
[env:clawd_loader]
platform = espressif8266
board = esp12e
framework = arduino
board_build.filesystem = littlefs
board_build.ldscript = eagle.flash.4m1m.ld
build_flags =
	-D LOADER_BUILD
	-D PIO_FRAMEWORK_ARDUINO_LWIP2_LOW_MEMORY
build_src_filter = -<*> +<loader.cpp>
