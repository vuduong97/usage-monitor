[project]
name = "clawd-desktop"
version = "0.1.3"
description = "Tray app that finds a Clawd desk clock on the LAN and shows your Claude usage on it"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "zeroconf>=0.132",
  "pystray>=0.19",
  "Pillow>=10",
  "pywebview>=5.3",
  "keyring>=25",
  "cryptography>=42",
]

[dependency-groups]
dev = ["pytest>=8", "bleak>=0.22"]
build = ["pyinstaller>=6.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = false
